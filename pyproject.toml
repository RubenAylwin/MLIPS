[project]
name = "mlips"
version = "0.0.1"
description = "MLIPS project"
authors = [
   { name = "Ruben Aylwin" }
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0,<3.0",
    "scipy>=1.12,<2.0",
    "matplotlib>=3.8,<4.0"
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["mlips*"]